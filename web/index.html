<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>awhbs game</title>
  <link rel="icon" type="image/png" href="__ASSET_DIR__/ui/heart.png" />
  <link rel="preload" as="font" type="font/ttf" href="__ASSET_DIR__/fonts/OMORI_GAME2.ttf" crossorigin />
  <style>
    @font-face { font-family: "OMORI"; src: url("__ASSET_DIR__/fonts/OMORI_GAME2.ttf") format("truetype"); font-display: swap; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    #awhbs-canvas { width: 100vw; height: 100vh; display: block; outline: none; }
    #loading { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 28px;
               align-items: center; justify-content: center; background: #fff; color: #141419;
               font-family: "OMORI", sans-serif; user-select: none; transition: opacity .5s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .title { font-size: 96px; line-height: 1; }
    #loading .bar { width: min(460px, 80vw); height: 18px; border: 3px solid #141419; background: #fff; position: relative; }
    #loading .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #141419; transition: width .15s; }
    #loading .bar.indeterminate .fill { width: 25%; animation: slide 1.1s ease-in-out infinite alternate; }
    @keyframes slide { from { left: 0; } to { left: 75%; } }
    #loading .stage { font-size: 32px; min-height: 1.2em; }
    #loading.failed .stage { color: #b3261e; }
    #loading .message { font: 15px monospace; max-width: min(640px, 90vw); text-align: center; color: #b3261e; user-select: text; }
    @media (max-width: 520px) { #loading .title { font-size: 60px; } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="title">awhbs game</div>
    <div class="bar indeterminate" id="loading-bar"><div class="fill" id="loading-fill"></div></div>
    <div class="stage" id="loading-stage">loading...</div>
    <div class="message" id="loading-message"></div>
  </div>
  <canvas id="awhbs-canvas"></canvas>
  <script>
    // Browsers keep audio suspended until the page gets input; resume every AudioContext the
    // engine creates on the first click or key.
    (() => {
      const contexts = [];
      for (const name of ["AudioContext", "webkitAudioContext"]) {
        const Original = window[name];
        if (!Original) continue;
        const Patched = function (...args) { const ctx = new Original(...args); contexts.push(ctx); return ctx; };
        Patched.prototype = Original.prototype;
        window[name] = Patched;
      }
      const resume = () => { for (const ctx of contexts) if (ctx.state === "suspended") ctx.resume().catch(() => {}); };
      for (const ev of ["pointerdown", "keydown", "touchstart"]) window.addEventListener(ev, resume, { capture: true, passive: true });
    })();

    // Pointer lock with raw ("unadjusted") mouse movement where supported: no OS acceleration,
    // and Chromium stops occasionally reporting the hidden cursor's re-centering as movement.
    (() => {
      const proto = window.Element && Element.prototype;
      const original = proto && proto.requestPointerLock;
      if (!original) return;
      let unadjusted = true;
      const plain = (el) => { const r = original.call(el); if (r && r.catch) r.catch(() => {}); return r; };
      proto.requestPointerLock = function () {
        if (!unadjusted) return plain(this);
        let r;
        try { r = original.call(this, { unadjustedMovement: true }); } catch (e) { unadjusted = false; return plain(this); }
        if (r && r.catch) r.catch((e) => { if (e && e.name === "NotSupportedError") { unadjusted = false; plain(this); } });
        return r;
      };
    })();

    (() => {
      const el = (id) => document.getElementById(id);
      const root = el("loading"), bar = el("loading-bar"), fill = el("loading-fill"), stage = el("loading-stage"), message = el("loading-message");
      const CONTROL_FLOW = "Using exceptions for control flow";
      const mb = (n) => `${(n / 1048576).toFixed(1)} mb`;
      let finished = false, failed = false;
      const set = (text, fraction) => {
        if (finished || failed) return;
        stage.textContent = text;
        const known = fraction !== null && Number.isFinite(fraction);
        bar.classList.toggle("indeterminate", !known);
        if (known) fill.style.width = `${Math.max(0, Math.min(1, fraction)) * 100}%`;
      };
      const fail = (msg) => {
        if (finished || failed) return;
        failed = true;
        root.classList.add("failed");
        bar.classList.remove("indeterminate");
        stage.textContent = "couldn't start";
        message.textContent = `${msg}`.slice(0, 400);
        console.error("awhbs failed to start:", msg);
      };
      // the wasm download is the first 70% of the bar, the engine's asset loading the rest
      const downloadWasm = async (url, expected) => {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${url}`);
        if (!res.body) return res;
        const total = expected || 0;
        let received = 0;
        const reader = res.body.getReader();
        const body = new ReadableStream({
          async pull(controller) {
            const { done, value } = await reader.read();
            if (done) { set("starting...", 0.72); controller.close(); return; }
            received += value.byteLength;
            set(total ? `downloading ${mb(Math.min(received, total))} / ${mb(total)}` : `downloading ${mb(received)}`, total ? 0.7 * Math.min(1, received / total) : null);
            controller.enqueue(value);
          },
          cancel(reason) { return reader.cancel(reason); },
        });
        return new Response(body, { status: 200, headers: { "Content-Type": "application/wasm" } });
      };
      // called by the game (src/web.rs) as its startup assets finish loading
      window.awhbsProgress = (loaded, total) => {
        set(`loading ${loaded} / ${total}`, 0.72 + 0.28 * (total ? loaded / total : 1));
        if (loaded >= total && !finished && !failed) {
          set("ready", 1);
          finished = true;
          root.classList.add("done");
          setTimeout(() => root.remove(), 600);
        }
      };
      window.awhbsLoading = { downloadWasm, fail, CONTROL_FLOW };
      window.addEventListener("error", (e) => { const m = `${e.message || e.error || e}`; if (!m.includes(CONTROL_FLOW)) fail(m); });
      window.addEventListener("unhandledrejection", (e) => { const m = `${e.reason}`; if (!m.includes(CONTROL_FLOW)) fail(m); });
    })();
  </script>
  <script type="module">
    // Two builds ship: awhbs-webgpu for browsers that hand out a WebGPU adapter, awhbs-webgl2 for
    // the rest. ?backend=webgl2|webgpu forces one; a WebGPU build that fails to start reloads once
    // with the WebGL2 one.
    const { downloadWasm, fail, CONTROL_FLOW } = window.awhbsLoading;
    const params = new URLSearchParams(location.search);
    const forced = params.get("backend");
    const BYTES = { webgpu: Number("__WASM_BYTES_WEBGPU__") || 0, webgl2: Number("__WASM_BYTES_WEBGL2__") || 0 };
    const pickBackend = async () => {
      if (forced === "webgl2" || forced === "webgpu") return forced;
      if (!navigator.gpu || !BYTES.webgpu) return "webgl2";
      try { return (await navigator.gpu.requestAdapter()) ? "webgpu" : "webgl2"; } catch (e) { return "webgl2"; }
    };
    (async () => {
      const backend = await pickBackend();
      console.log(`awhbs: ${backend} renderer`);
      try {
        const { default: init } = await import(`./awhbs-${backend}.js?v=__CACHE_BUST__`);
        await init({ module_or_path: downloadWasm(new URL(`./awhbs-${backend}_bg.wasm?v=__CACHE_BUST__`, import.meta.url), BYTES[backend]) });
      } catch (e) {
        if (`${e}`.includes(CONTROL_FLOW)) return;
        if (backend === "webgpu" && !forced) {
          params.set("backend", "webgl2");
          location.replace(`${location.pathname}?${params}${location.hash}`);
          return;
        }
        fail(e);
        throw e;
      }
    })();
  </script>
</body>
</html>
