; awhbs leaderboard server on sarahvps. Installed once:
;   sudo cp deploy/awhbs.supervisor.conf /etc/supervisor/conf.d/awhbs.conf && sudo supervisorctl update
; The deploy workflow copies the binary to /srv/awhbs/awhbs-server and restarts this program;
; it reads /srv/awhbs/.env from its working directory.
[program:awhbs-server]
command=/srv/awhbs/awhbs-server
directory=/srv/awhbs
autostart=true
autorestart=true
user=debian
stdout_logfile=/var/log/supervisor/awhbs-server.log
stderr_logfile=/var/log/supervisor/awhbs-server-error.log
stopasgroup=true
