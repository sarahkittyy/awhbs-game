# awhbs.fluffycat.gay on sarahvps. Installed once by hand (the deploy workflow does not touch nginx):
#
#   sudo cp deploy/awhbs.nginx.conf /etc/nginx/sites-enabled/awhbs.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d awhbs.fluffycat.gay      # adds the 443 server and the redirect
#
#   /             the web build (build-web.sh -> /srv/awhbs/dist, published by the workflow)
#   /api/, /health  -> awhbs-server on 127.0.0.1:3547 (supervisor program awhbs)

# Backstop for the API on top of the server's own per-address limits.
limit_req_zone $binary_remote_addr zone=awhbs_api:10m rate=10r/s;

server {
    server_name awhbs.fluffycat.gay;
    root /srv/awhbs/dist;

    types {
        text/html            html;
        text/javascript      js;
        application/wasm     wasm;
        model/gltf-binary    glb;
        image/png            png;
        audio/ogg            ogg;
        font/ttf             ttf;
        application/json     json;
        text/markdown        md;
    }
    default_type application/octet-stream;

    # precompressed awhbs-*.wasm.gz / .js.gz from build-web.sh
    gzip_static on;

    location /api/ {
        limit_req zone=awhbs_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3547;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://127.0.0.1:3547;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # index.html changes in place; everything it points at is versioned or content-hashed
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    listen 80;
    listen [::]:80;
}
