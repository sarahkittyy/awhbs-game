[package]
name = "awhbs"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "server"]
resolver = "3"

[features]
# Browser graphics API for the wasm build; build-web.sh builds one wasm per backend and the page
# picks one. Enable exactly one for wasm, neither for desktop.
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]

[dependencies]
bevy = { version = "0.20", features = ["vorbis"] }
fastrand = "2.5.0"
ehttp = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
fastrand = { version = "2.5.0", features = ["js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Storage"] }
console_error_panic_hook = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
debug = false
strip = true

# decoders run at load time; keep them fast even in the size-optimised build
[profile.wasm-release.package.png]
opt-level = 3
[profile.wasm-release.package.image]
opt-level = 3
[profile.wasm-release.package.lewton]
opt-level = 3
[profile.wasm-release.package.gltf]
opt-level = 3
[profile.wasm-release.package.gltf-json]
opt-level = 3
[profile.wasm-release.package.serde_json]
opt-level = 3
